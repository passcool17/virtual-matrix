# Publication GitLab Pages : le jeu est 100 % statique, on copie simplement les fichiers dans public/.
stages: [deploy]

pages:
  stage: deploy
  image: alpine:3.20
  script:
    - mkdir -p public
    - cp -r index.html style.css favicon.svg js vendor fonts public/
  artifacts:
    paths: [public]
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
